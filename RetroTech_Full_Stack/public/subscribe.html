<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <meta name="description" content="RetroTech Subscribe">
    
    <link rel="preconnect" href="http://fonts.googleapis.com">
    <link rel="preconnect" href="http://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="index.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">

    <title>Subscribe | RetroTech</title>
</head>

<body>

    <div id="header">

        <h1>Retro<span>Tech</span></h1>

        <div>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="subscribe.html">Subscribe</a>
        </div>

    </div>

    <div class="subscribe-page">

        <h1>Subscribe</h1>

        <p>
            Join our mailing list! Be the first to get
            notified when new (old) stock comes in!
        </p>

        <form id="subscribe-form">

            <label>Email:</label>

            <input
                type="email"
                id="email-input"
                placeholder="James@whatever.com"
                required
            >

            <button id="sub-btn">
                send
            </button>

        </form>

        <p id="message"></p>

        <img
            src="images/store.jpg"
            alt="Retro Store"
            class="store-image"
        >

    </div>

    <div id="footer">
        <p>@2025 RetroTech. All rights reserved.</p>
    </div>

    <script src="index.js"></script>

</body>
</html>
