<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="scorecard.css">
    </head>
    <body>
        <div class="scoreboard">
            <div class="team">
                <h2 class="team-title">HOME</h2>
                <div class="score-box">
                    <span id="home-score">1</span>
                </div>
                <div class="buttons">
                    <button onclick="home1()">+1</button>
                    <button onclick="home2()">+2</button>
                    <button onclick="home3()">+3</button>
                </div>
            </div>


            <div class="team">
                <h2 class="team-title">GUEST</h2>
                <div class="score-box">
                    <span id="guest-score">5</span>
                </div>
                <div class="buttons">
                    <button onclick="guest1()">+1</button>
                    <button onclick="guest2()">+2</button>
                    <button onclick="guest3()">+3</button>
                </div>
            </div>
        </div>
    </body>
    <script src="scorecard.js"></script>
</html>
